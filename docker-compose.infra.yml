services:

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin

  api1:
    image: ledgerflow-api:latest
    environment:
      MONGO_URI: mongodb://admin:admin@mongo:27017/barDaFilo?authSource=admin
      INSTANCE_NAME: api1

  api2:
    image: ledgerflow-api:latest
    environment:
      MONGO_URI: mongodb://admin:admin@mongo:27017/barDaFilo?authSource=admin
      INSTANCE_NAME: api2


  nginx:
    image: nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf