  test-unit:
  runs-on: ubuntu-latest

  env:
    NODE_ENV: test

  steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - run: npm ci

    - name: Create .env file
      run: |
        echo "NODE_ENV=test" > .env

    - name: Run unit tests
      run: npm run test:unit
    